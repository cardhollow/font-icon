  <title>CHXD Icon Fonts</title>

      font-family: "CHXD Bags and Storage";
      src: url("fonts/bags_and_storage.ttf") format("truetype");
    }

    @font-face {
      font-family: "CHXD Code Editor";
      src: url("fonts/code_editor.ttf") format("truetype");
    }

    @font-face {
      font-family: "CHXD Design Tools";
      src: url("fonts/design_tools.ttf") format("truetype");
    }

      font-family: "CHXD Documents and Media";
      src: url("fonts/documents_and_media.ttf") format("truetype");
    }

      font-family: "CHXD Editing";
      src: url("fonts/editing.ttf") format("truetype");
    }

    @font-face {
      font-family: "CHXD File Management";
      src: url("fonts/file_management.ttf") format("truetype");
    }

    @font-face {
      font-family: "CHXD File Operations";
      src: url("fonts/file_operations.ttf") format("truetype");
    }

    @font-face {
      font-family: "CHXD Media";
      src: url("fonts/media.ttf") format("truetype");
    }

    @font-face {
      font-family: "CHXD Miscellaneous";
      src: url("fonts/miscellaneous.ttf") format("truetype");
    }

    @font-face {
      font-family: "CHXD Navigation";
      src: url("fonts/navigation.ttf") format("truetype");
    }

    @font-face {
      font-family: "CHXD Sorting and Views";
      src: url("fonts/sorting_and_views.ttf") format("truetype");
    }

    @font-face {
      font-family: "CHXD Text Editor";
      src: url("fonts/text_editor.ttf") format("truetype");
    }

    @font-face {
      font-family: "CHXD UI Controls";
      src: url("fonts/ui_controls.ttf") format("truetype");
    }

    :root {
      color-scheme: light dark;
      --line: #d0d0d0;
      --sel: #2563eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px;
      font: 14px system-ui, sans-serif;
    }

    .bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    select,
    input {
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: transparent;
      color: inherit;
      font: inherit;
    }

    #q {
      flex: 1;
      min-width: 140px;
    }

    .group + .group {
      margin-top: 22px;
    }

    .group h2 {
      margin: 0 0 8px;
      font-size: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
      gap: 6px;
    }

    .cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: transparent;
      color: inherit;
      font-size: 30px;
      cursor: pointer;
    }

    .cell:hover {
      border-color: var(--sel);
    }

    .cell.on {
      border-color: var(--sel);
      outline: 2px solid var(--sel);
    }

    .key {
      position: absolute;
      top: 3px;
      left: 5px;
      font: 11px/1 ui-monospace, Menlo, Consolas, monospace;
      opacity: 0.6;
    }

    #info {
      position: sticky;
      bottom: 0;
      display: none;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: Canvas;
    }

    #info.show {
      display: flex;
    }

    #big {
      font-size: 44px;
      line-height: 1;
    }

    #txt {
      flex: 1;
      min-width: 160px;
    }

    #txt small {
      display: block;
      font-size: 12px;
      opacity: 0.65;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      text-decoration: none;
      border: 1px solid var(--sel);
      border-radius: 4px;
      background: var(--sel);
      color: #fff;
      font: inherit;
      cursor: pointer;
    }

    .tester {
      margin-top: 14px;
    }

    .visit {
      margin: 18px 0 0;
      font-size: 13px;
      opacity: 0.8;
    }

    #in {
      width: 100%;
    }

    #test {
      min-height: 1.4em;
      font-size: 36px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

  <div class="bar">
    <select id="fam" aria-label="Font family"></select>

    var current = "all";
    var selected = null;
    var previewFont = 0;

    function $(id) {
      return document.getElementById(id);
    }

    function family(index) {
      return '"' + FONTS[index].family + '"';
    }

    function visibleFonts() {
      if (current === "all") {
        return FONTS.map(function (font, i) {
          return i;
        });
      }
      return [current];
    }

    function buildCss(fontIndex, glyph) {
      var hex = glyph.c.charCodeAt(0).toString(16).toUpperCase();
      var prefix = FONTS[fontIndex].prefix ? FONTS[fontIndex].prefix + "-" : "";
      return [
        '@font-face {',
        '  font-family: ' + family(fontIndex) + ';',
        '  src: url("fonts/' + FONTS[fontIndex].file + '") format("truetype");',
        '}',
        '',
        '.icon-' + prefix + glyph.n + '::before {',
        '  font-family: ' + family(fontIndex) + ';',
        '  content: "\\' + hex + '";',
        '}'
      ].join('\n');
    }

    function updateDownload() {
      var link = $("dl");
      var file = current === "all" ? "IconFonts.zip" : FONTS[current].file;
      link.href = "fonts/" + file;
      link.setAttribute("download", file);
      link.textContent = current === "all" ? "Download .zip" : "Download .ttf";
    }

    function fillFamilies() {
      var all = document.createElement("option");
      all.value = "all";
      all.textContent = "All (" + FONTS.length + " fonts)";
      $("fam").appendChild(all);

      FONTS.forEach(function (font, i) {
        var option = document.createElement("option");
        option.value = i;
        option.textContent = font.family + " (" + font.glyphs.length + ")";
        $("fam").appendChild(option);
      });
    }

    function drawGrid() {
      var query = $("q").value.toLowerCase();
      var root = $("grid");
      root.textContent = "";

      visibleFonts().forEach(function (fontIndex) {
        var font = FONTS[fontIndex];
        var group = document.createElement("section");
        group.className = "group";

        if (current === "all") {
          var title = document.createElement("h2");
          title.textContent = font.family;
          group.appendChild(title);
        }

        var grid = document.createElement("div");
        grid.className = "grid";

        font.glyphs.forEach(function (glyph) {
          var matches = !query || glyph.n.toLowerCase().indexOf(query) >= 0 || glyph.c === $("q").value;
          if (!matches) {
            return;
          }

          var cell = document.createElement("button");
          cell.type = "button";
          var isSelected = selected && selected.font === fontIndex && selected.glyph.c === glyph.c;
          cell.className = "cell" + (isSelected ? " on" : "");
          cell.title = glyph.n;

          var key = document.createElement("span");
          key.className = "key";
          key.textContent = glyph.c;

          var icon = document.createElement("span");
          icon.textContent = glyph.c;
          icon.style.fontFamily = family(fontIndex);

          cell.append(key, icon);
          cell.onclick = function () {
            selected = { font: fontIndex, glyph: glyph };
            previewFont = fontIndex;
            drawGrid();
            drawInfo();
          };
          grid.appendChild(cell);
        });

        if (grid.children.length > 0) {
          group.appendChild(grid);
          root.appendChild(group);
        }
      });

      $("test").style.fontFamily = family(previewFont);
      $("test").textContent = $("in").value;
    }

    function drawInfo() {
      var info = $("info");
      if (!selected) {
        info.className = "";
        return;
      }
      info.className = "show";

      $("big").style.fontFamily = family(selected.font);
      $("big").textContent = selected.glyph.c;

      var name = document.createElement("b");
      name.textContent = selected.glyph.n + "  [" + selected.glyph.c + "]";

      var detail = document.createElement("small");
      detail.textContent = FONTS[selected.font].family;

      $("txt").textContent = "";
      $("txt").append(name, detail);
    }

    function copyText(text, done) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done);
        return;
      }
      var box = document.createElement("textarea");
      box.value = text;
      document.body.appendChild(box);
      box.select();
      document.execCommand("copy");
      box.remove();
      done();
    }

    $("fam").onchange = function () {
      current = $("fam").value === "all" ? "all" : Number($("fam").value);
      selected = null;
      previewFont = current === "all" ? 0 : current;
      updateDownload();
      drawInfo();
      drawGrid();
    };

    $("q").oninput = drawGrid;
    $("in").oninput = drawGrid;

    $("copy").onclick = function () {
      var button = $("copy");
      copyText(buildCss(selected.font, selected.glyph), function () {
        button.textContent = "Copied";
        setTimeout(function () {
          button.textContent = "Copy CSS";
        }, 1200);
      });
    };

    fillFamilies();
    updateDownload();
    drawGrid();
  </script>
